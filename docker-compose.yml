# PRODUCTION stack for a single VPS: Caddy (auto-HTTPS reverse proxy) + Postgres + backend + frontend.
# Read docs/DEPLOY.md. Configuration comes from a `.env` file next to this one (copy
# .env.production.example) — compose reads it automatically for the ${VAR} substitutions below.
# Secrets are REQUIRED (`:?`): `docker compose up` refuses to start with a clear message if one is
# missing, instead of falling back to an insecure default. For a local try-out with dev defaults use
# docker-compose.local.yml instead.
#
# Network exposure: ONLY Caddy publishes ports (80/443). Postgres, backend and frontend are reachable
# solely on the private compose network — never `ports:` them, or Docker will publish them past the
# host firewall (ufw does not filter Docker-published ports) and the backend's rate limiting (which
# trusts X-Forwarded-For from Caddy, TRUST_PROXY=1) could be bypassed by talking to it directly.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. wavehub.example.com) in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (Let's Encrypt expiry notices) in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — losing this volume means re-issuing (rate-limited by Let's Encrypt)
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wavehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wavehubdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # --- database ---
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-wavehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_NAME: ${POSTGRES_DB:-wavehubdb}
      TYPEORM_SYNC: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # --- secrets (the backend refuses to boot in production if any is missing/weak/placeholder) ---
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32) in .env}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?set KEY_ENCRYPTION_SECRET (openssl rand -hex 32) in .env}
      # --- URLs / proxy ---
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL (https://your-domain) in .env}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:?set BACKEND_PUBLIC_URL (https://your-domain/api) in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN (https://your-domain) in .env}
      TRUST_PROXY: "1" # exactly one proxy hop: Caddy
      # --- email ---
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?set EMAIL_PROVIDER (resend, smtp, or console) in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # --- file storage ---
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOADS_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # --- Bank of Georgia (optional until the owner supplies production credentials) ---
      BOG_CLIENT_ID: ${BOG_CLIENT_ID:-}
      BOG_CLIENT_SECRET: ${BOG_CLIENT_SECRET:-}
      BOG_OAUTH_URL: ${BOG_OAUTH_URL:-}
      BOG_ORDERS_URL: ${BOG_ORDERS_URL:-}
      BOG_CALLBACK_PUBLIC_KEY: ${BOG_CALLBACK_PUBLIC_KEY:-}
      REQUEST_LOG: ${REQUEST_LOG:-on}
    volumes:
      - uploads:/data/uploads
    expose:
      - "4000"
    # Only meaningful when EMAIL_PROVIDER=smtp and SMTP_HOST=host.docker.internal — lets the
    # container reach a mail relay (e.g. Postfix) running on the HOST itself, outside Docker.
    # "host-gateway" resolves to whatever the current bridge gateway IP is; harmless when unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s # lets in-flight requests/transactions finish on SIGTERM
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the browser bundle at build time — rebuild (`docker compose build frontend`)
        # after changing it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL (https://your-domain/api) in .env}
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    logging: *default-logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
