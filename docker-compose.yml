version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wavehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavehubpass}
      POSTGRES_DB: ${POSTGRES_DB:-wavehubdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET must contain at least 32 characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-wavehub}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-wavehubpass}
      DATABASE_NAME: ${POSTGRES_DB:-wavehubdb}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must list the frontend origin}
      TYPEORM_SYNC: ${TYPEORM_SYNC:-true}
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: frontend-static.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
